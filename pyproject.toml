[project]
name = "aws-monitor"
version = "1.0.0"
description = "AWS IAM and S3 Monitoring CLI - Monitor IAM users, S3 buckets, and scan for security risks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "typer>=0.12.0",
]

[project.scripts]
aws-monitor = "aws_monitor.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
